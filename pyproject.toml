[project]
name = "voltronic-charger"
version = "0.7.1"
description = "Voltronic AC charger telemetry and guarded control bridge for Venus OS"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = ["pyserial>=3.4"]

[project.scripts]
voltronic-probe = "voltronic_charger.probe:main"
voltronic-charger = "voltronic_charger.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
